services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tamam
      POSTGRES_USER: tamam
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mailhog
      - minio
    environment:
      COMPOSER_PROCESS_TIMEOUT: "0"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: tamam
      DB_USERNAME: tamam
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      AWS_BUCKET: tamam-public
      PUBLIC_ASSETS_URL: http://localhost:9000/tamam-public
      AWS_URL: http://localhost:9000/tamam-public
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      PUBLIC_ASSETS_DRIVER: s3
      STORAGE_PROVISION_BUCKETS: "true"
    command: sh -c "composer install && if ! grep -q '^APP_KEY=base64:' .env 2>/dev/null; then cp .env.example .env && php artisan key:generate; fi && php artisan storage:ensure-public-bucket && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
      - workspace_frontend_node_modules:/workspace/frontend/node_modules
      - workspace_admin_node_modules:/workspace/admin/node_modules
      - workspace_shared_node_modules:/workspace/shared/node_modules
      - pnpm_store:/workspace/.pnpm-store
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/ar', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 600s
    command: sh -c "corepack enable && pnpm install && pnpm --filter @tamam/frontend dev --hostname 0.0.0.0 --port 3000"

  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - workspace_node_modules:/workspace/node_modules
      - workspace_frontend_node_modules:/workspace/frontend/node_modules
      - workspace_admin_node_modules:/workspace/admin/node_modules
      - workspace_shared_node_modules:/workspace/shared/node_modules
      - pnpm_store:/workspace/.pnpm-store
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      frontend:
        condition: service_healthy
    command: sh -c "corepack enable && pnpm --filter @tamam/admin dev --hostname 0.0.0.0 --port 3000"

volumes:
  postgres_data:
  minio_data:
  backend_vendor:
  workspace_node_modules:
  workspace_frontend_node_modules:
  workspace_admin_node_modules:
  workspace_shared_node_modules:
  pnpm_store:
